<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>বিবাহ অ্যালবাম | Abhijit Biswas</title><style>
*{box-sizing:border-box}body{margin:0;background:#171717;color:white;font-family:"Noto Sans Bengali","Segoe UI",sans-serif}header{text-align:center;padding:17px;background:#242424;border-bottom:1px solid #b99e6b}header a{float:left;color:#e9d4a8;text-decoration:none;margin-top:8px}h1{font-size:clamp(21px,4vw,30px);color:#f0d9ac;margin:4px}main{max-width:950px;margin:auto;padding:20px 14px 40px}.viewer{background:#292929;border:1px solid #806c49;border-radius:15px;padding:12px}.stage{height:min(65vh,620px);min-height:260px;display:flex;align-items:center;justify-content:center;background:#101010;border-radius:10px;overflow:hidden}.stage img{max-width:100%;max-height:100%;object-fit:contain}.empty{text-align:center;padding:25px;color:#eadbb9;line-height:1.8}.caption{text-align:center;color:#ddd;padding:12px}.controls{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap}button{border:0;border-radius:8px;background:#087f7b;color:#fff;padding:11px 15px;font-size:15px}.count{color:#e9d4a8;min-width:60px;text-align:center}.note{margin-top:16px;padding:13px;border-radius:10px;background:#292929;color:#d7d0c5;font-size:14px;line-height:1.7}@media(max-width:560px){.stage{height:58vh;min-height:240px}}
</style></head><body><header><a href="../index.html">← হোম</a><h1>বিবাহ অ্যালবাম</h1></header><main><div class="viewer"><div class="stage" id="stage"></div><div class="caption" id="caption"></div><div class="controls"><button id="prev">⟵ আগের</button><button id="play">▶ স্লাইডশো চালু</button><button id="next">পরের ⟶</button><span class="count" id="count">0 / 0</span></div></div><div class="note"><b>Google Drive থেকে ছবি যোগ:</b> Drive ছবির Share সেটিং “Anyone with the link” → Viewer করুন। শেয়ার লিংকের /d/ এবং /view-এর মাঝের File ID নিচের PHOTO_IDS তালিকায় বসান। উদাহরণ: <code>https://drive.google.com/file/d/ABC123/view</code> হলে ID হলো <code>ABC123</code>।</div></main><script>
const PHOTO_IDS = [
  // "এখানে_ছবির_File_ID_লিখুন",
];
const photos=PHOTO_IDS.map(id=>"https://drive.google.com/uc?export=view&id="+id);
let i=0,timer=null;const stage=document.getElementById("stage"),caption=document.getElementById("caption"),count=document.getElementById("count"),play=document.getElementById("play");
function show(){stage.innerHTML="";if(!photos.length){stage.innerHTML='<div class="empty">এখনও ছবি যোগ করা হয়নি।<br>PHOTO_IDS তালিকায় Google Drive-এর ছবির ID বসান।</div>';caption.textContent="";count.textContent="0 / 0";return}let img=document.createElement("img");img.src=photos[i];img.alt="Album photo "+(i+1);img.onerror=()=>stage.innerHTML='<div class="empty">ছবিটি লোড হচ্ছে না। Drive-এর শেয়ার সেটিং এবং File ID পরীক্ষা করুন।</div>';stage.appendChild(img);caption.textContent="স্মৃতির ছবি "+(i+1);count.textContent=(i+1)+" / "+photos.length}
function next(){if(photos.length){i=(i+1)%photos.length;show()}}function prev(){if(photos.length){i=(i-1+photos.length)%photos.length;show()}}
document.getElementById("next").onclick=next;document.getElementById("prev").onclick=prev;play.onclick=()=>{if(timer){clearInterval(timer);timer=null;play.textContent="▶ স্লাইডশো চালু"}else if(photos.length>1){timer=setInterval(next,3500);play.textContent="⏸ স্লাইডশো বন্ধ"}};show();
</script></body></html>
